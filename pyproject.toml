[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "statewatch"
version = "0.1.0"
description = "Dependency-aware infrastructure drift detector for GCP"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "pyjeebz" }]
keywords = ["terraform", "drift", "gcp", "infrastructure", "sre"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "google-cloud-asset>=3.20",
    "google-cloud-storage>=2.10",
    "google-auth>=2.0",
    "networkx>=3.0",
    "pyyaml>=6.0",
    "schedule>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/pyjeebz/statewatch"
Repository = "https://github.com/pyjeebz/statewatch"

[project.scripts]
statewatch = "statewatch.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/statewatch"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# B008: Typer's idiomatic argument-default pattern (`x: T = typer.Option(...)`) is a
# deliberate function call in a default; it is the documented usage, not a bug.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
packages = ["statewatch"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
